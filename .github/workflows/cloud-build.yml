name: Cloud Build Desktop

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - ubuntu-24.04-x64
          - macos-15-arm64
          - windows-2025-x64
          - macos-15-intel
      updater_artifacts:
        description: Create Tauri updater artifacts (requires signing secrets)
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - .github/workflows/cloud-build.yml
      - Cargo.lock
      - Cargo.toml
      - package.json
      - pnpm-lock.yaml
      - src/**
      - src-tauri/**
      - crates/**
      - vite.config.ts
      - tsconfig*.json

permissions:
  contents: read

concurrency:
  group: cloud-build-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'auto' }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  CI: "true"
  HUSKY: "0"
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  select-targets:
    name: Select build targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Create target matrix
        id: matrix
        shell: bash
        run: |
          selected="${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}"

          case "$selected" in
            macos-arm64|macos-15-arm64)
              matrix='{"include":[{"id":"macos-15-arm64","name":"macOS 15 arm64","os":"macos-15","rust-target":"aarch64-apple-darwin"}]}'
              ;;
            macos-intel|macos-15-intel)
              matrix='{"include":[{"id":"macos-15-intel","name":"macOS 15 Intel","os":"macos-15-intel","rust-target":"x86_64-apple-darwin"}]}'
              ;;
            windows-x64|windows-2025-x64)
              matrix='{"include":[{"id":"windows-2025-x64","name":"Windows 2025 x64","os":"windows-2025","rust-target":"x86_64-pc-windows-msvc"}]}'
              ;;
            linux-x64|ubuntu-24.04-x64)
              matrix='{"include":[{"id":"ubuntu-24.04-x64","name":"Ubuntu 24.04 x64","os":"ubuntu-24.04","rust-target":"x86_64-unknown-linux-gnu"}]}'
              ;;
            all)
              matrix='{"include":[{"id":"ubuntu-24.04-x64","name":"Ubuntu 24.04 x64","os":"ubuntu-24.04","rust-target":"x86_64-unknown-linux-gnu"},{"id":"macos-15-arm64","name":"macOS 15 arm64","os":"macos-15","rust-target":"aarch64-apple-darwin"},{"id":"windows-2025-x64","name":"Windows 2025 x64","os":"windows-2025","rust-target":"x86_64-pc-windows-msvc"}]}'
              ;;
            *)
              echo "Unsupported platform: $selected"
              exit 1
              ;;
          esac

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: select-targets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-targets.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show initial disk usage
        shell: bash
        run: |
          df -h

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Cargo registry and git dependencies
        uses: swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: cloud-build-${{ matrix.rust-target }}
          cache-on-failure: true

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install unixodbc libtool

      - name: Bundle macOS ODBC libraries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          odbc_lib="$(brew --prefix unixodbc)/lib/libodbc.2.dylib"
          ltdl_lib="$(brew --prefix libtool)/lib/libltdl.7.dylib"
          cp "$odbc_lib" src-tauri/libodbc.2.dylib
          cp "$ltdl_lib" src-tauri/libltdl.7.dylib
          install_name_tool -id "@rpath/libodbc.2.dylib" src-tauri/libodbc.2.dylib
          install_name_tool -id "@rpath/libltdl.7.dylib" src-tauri/libltdl.7.dylib
          install_name_tool -change "$ltdl_lib" "@rpath/libltdl.7.dylib" src-tauri/libodbc.2.dylib

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev unixodbc-dev

      - name: Prepare Tauri updater signing key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.updater_artifacts }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_BASE64 }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY_BASE64" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_BASE64 is required when updater_artifacts is enabled."
            exit 1
          fi

          if base64 --help 2>&1 | grep -q -- "--decode"; then
            echo "$TAURI_SIGNING_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/updater.key"
          else
            echo "$TAURI_SIGNING_PRIVATE_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/updater.key"
          fi
          key_b64="$(base64 < "$RUNNER_TEMP/updater.key" | tr -d '\r\n')"
          echo "TAURI_SIGNING_PRIVATE_KEY=$key_b64" >> "$GITHUB_ENV"

          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build Tauri app
        shell: bash
        run: |
          build_args=(--ci --no-sign --target "${{ matrix.rust-target }}")

          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs.updater_artifacts }}" != "true" ]]; then
            build_args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi

          pnpm exec tauri build "${build_args[@]}"

      - name: Show final disk usage
        if: always()
        shell: bash
        run: |
          df -h
          du -sh target || true
          du -sh target/${{ matrix.rust-target }}/release/bundle || true

      - name: Collect desktop artifacts
        shell: bash
        run: |
          bundle_dir="target/${{ matrix.rust-target }}/release/bundle"
          rm -rf cloud-artifacts
          mkdir -p \
            cloud-artifacts/dmg \
            cloud-artifacts/app \
            cloud-artifacts/exe \
            cloud-artifacts/msi \
            cloud-artifacts/deb \
            cloud-artifacts/appimage \
            cloud-artifacts/rpm \
            cloud-artifacts/zip \
            cloud-artifacts/tar-gz \
            cloud-artifacts/updater

          find "$bundle_dir" -type f -name "*.dmg" -exec cp {} cloud-artifacts/dmg/ \;
          find "$bundle_dir" -type f -name "*.exe" -exec cp {} cloud-artifacts/exe/ \;
          find "$bundle_dir" -type f -name "*.msi" -exec cp {} cloud-artifacts/msi/ \;
          find "$bundle_dir" -type f -name "*.deb" -exec cp {} cloud-artifacts/deb/ \;
          find "$bundle_dir" -type f -name "*.AppImage" -exec cp {} cloud-artifacts/appimage/ \;
          find "$bundle_dir" -type f -name "*.rpm" -exec cp {} cloud-artifacts/rpm/ \;
          find "$bundle_dir" -type f -name "*.zip" -exec cp {} cloud-artifacts/zip/ \;
          find "$bundle_dir" -type f -name "*.tar.gz" -exec cp {} cloud-artifacts/tar-gz/ \;
          find "$bundle_dir" -type f -name "*.sig" -exec cp {} cloud-artifacts/updater/ \;

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            while IFS= read -r -d '' app_path; do
              app_name="$(basename "$app_path" .app)"
              ditto -c -k --sequesterRsrc --keepParent "$app_path" "cloud-artifacts/app/${app_name}-${{ matrix.id }}.app.zip"
            done < <(find "$bundle_dir" -type d -name "*.app" -print0)
          fi

          find cloud-artifacts -type f -print
          test -n "$(find cloud-artifacts -type f -print -quit)"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBX-${{ matrix.id }}-dmg
          path: cloud-artifacts/dmg/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBX-${{ matrix.id }}-app
          path: cloud-artifacts/app/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBX-${{ matrix.id }}-exe
          path: cloud-artifacts/exe/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Windows MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBX-${{ matrix.id }}-msi
          path: cloud-artifacts/msi/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBX-${{ matrix.id }}-deb
          path: cloud-artifacts/deb/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBX-${{ matrix.id }}-appimage
          path: cloud-artifacts/appimage/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBX-${{ matrix.id }}-rpm
          path: cloud-artifacts/rpm/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBX-${{ matrix.id }}-zip
          path: cloud-artifacts/zip/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBX-${{ matrix.id }}-tar-gz
          path: cloud-artifacts/tar-gz/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload updater signature artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DBX-${{ matrix.id }}-updater
          path: cloud-artifacts/updater/*
          if-no-files-found: ignore
          retention-days: 14
